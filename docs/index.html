<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>
    <link rel="stylesheet" href="d44de3d67d107ec57a2f.css">
<script defer src="bundle.js"></script></head>
<body>
    <div class="main">
        <h1>Weather</h1>
        <form action="" id="search-form">
            <input type="text" id="search-input" placeholder="Search City">
            <button type="submit" id="search-button">Search</button>
        </form>
        
        <div class="container">
            <div class="card-header">
                <h2 id="location"></h2>
                <p>Data: <span id="time"></span></p>
            </div>
            <div class="card-left">
                <img alt="" id="weather-icon">
                <div id="current-temp"></div>
            </div>
            <div class="card-right">
                <div class="weather-details">
                    <span>Condition</span>
                    <span id="condition"></span>
                </div>
                <div class="weather-details">
                    <span>Feels Like</span>
                    <span id="feels-like"></span>
                </div>
                <div class="weather-details">
                    <span>Humidity</span>
                    <span id="humidity"></span>
                </div>
                <div class="weather-details">
                    <span>Wind Gusts</span>
                    <span id="wind-gusts"></span>
                </div>
            </div>
        </div>
    </div>
    
    <script src="c82693b537158b9302bd.js"></script>
</body>
</html>
